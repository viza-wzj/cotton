version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: cotton-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=http://8.130.38.145,http://8.130.38.145:80
    volumes:
      - backend-data:/app/apps/backend/data

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: cotton-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
